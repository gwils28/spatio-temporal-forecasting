[project]
name = "stforecast"
version = "0.1.0"
description = "Prévision spatio-temporelle sur METR-LA : STID (sans graphe) vs Graph WaveNet"
readme = "README.md"
authors = [
    { name = "Wilson Goma" }
]
requires-python = ">=3.12"
dependencies = [
    "gdown>=6.5.2",
    "h5py>=3.16.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pytest>=9.2.0",
    "pyyaml>=6.0.4",
    "ruff>=0.17.6",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "tables>=3.11.1",
    "tabulate>=0.10.0",
    "torch>=2.11.0",
    "tqdm>=4.66.5",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu128"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_notebook.py" = ["E501"]
